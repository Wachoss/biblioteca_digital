<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Biblioteca Digital{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='vendor/pico-2.1.1.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  <script src="{{ url_for('static', path='vendor/htmx-2.0.11.min.js') }}" defer></script>
</head>
<body>
  <header class="container">
    <nav>
      <ul><li><a href="{{ url_for('catalog_page') }}" class="brand">Biblioteca Digital</a></li></ul>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="container site-footer">
    {% if is_owner(request) %}
    <form method="post" action="{{ url_for('logout') }}">
      <small>Has iniciado sesión.</small>
      <button type="submit" class="outline secondary">Salir</button>
    </form>
    {% elif request.url.path != url_for('login_page').path %}
    <small><a href="{{ url_for('login_page') }}?next={{ request.url.path | urlencode }}">Entrar</a></small>
    {% endif %}
  </footer>
</body>
</html>
